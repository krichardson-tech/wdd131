<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="RecipeBook">
    <meta property="og:description" content="A place to find recipies.">
    <meta property="og:url" content="http://krichardson-tech.github.io/wdd131/recipe/index.html">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="RecipeBook">
    <meta name="twitter:description" content="A place to find recipies.">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <title>RecipeBook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <sections class="heading">
            <img src="images/recipe-book.png" alt="recipe book icon" class="heading-icon">
            <h1>RecipeBook</h1>
        </sections>

        <sections class="search">
            <input type="text" placeholder="Find a recipe" class="search-input">
            <button class="search-button"><img src="images/search.svg" alt="search icon"></button>
        </sections>
        
        <sections class="recipies">
            <section class="recipe-card">
                <img src="images/apple-crisp.jpg" alt="recipe image" class="recipe-image">
                <button class="recipe-button" aria-label="View Recipe">Dessert</button>
                <h2 class="recipe-title">Apple Crisp</h2>
                <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars"
                >
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>
                <p class="recipe-description">A brief description of the recipe goes here.</p>
            </section>
        </section>
    </main>
    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>            
    </footer>
</body>
</html>
