<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore Snortleblat, a swamp beast diplomat character card with level and health information.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="A simple character card and its information">
    <meta property="og:url" content="https://krichardson-tech.github.io/wdd131/charactercard/character.html">
    <meta property="og:image" content="https://krichardson-tech.github.io/wdd131/charactercard/images/socialpic.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="A simple character card and its information">
    <meta name="twitter:image" content="https://krichardson-tech.github.io/wdd131/charactercard/images/socialpic.png">

    <!-- Favicon -->
    <link rel="icon" href="images/charactercard.png" type="image/png">

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="https://krichardson-tech.github.io/wdd131/charactercard/images/applepic.png">

    <title>Character Card</title>
    <link rel="stylesheet" href="character.css">
    <script src="character.js" defer></script>
</head>
<body>
    <main class="card">
        <img src="images/cardpic.webp" alt="Snortleblat" class="image">
        <h1 class="name">Snortleblat</h1>
        <section class="stats">
            <p class="class"><strong>Class:</strong> Swamp Beast Diplomat</p>
            <p class="level"><strong>Level:</strong> <span id="level">1</span></p>
            <p class="health"><strong>Health:</strong> <span id="health">100</span></p>
        </section>
        <div class="buttons">
            <button class="attacked">Attacked</button>
            <button class="levelUp">Level Up</button>
        </div>
    </main>
</body>
</html>
